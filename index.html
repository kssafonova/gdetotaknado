<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HS Portal — 3D preview</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f4f4f2;color:#141414;font-family:Inter,Arial,sans-serif}
    main{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:18px}
    h1{font-size:clamp(28px,4vw,58px);font-weight:500;letter-spacing:-.04em;margin:0}.meta{font-size:14px;color:#666;line-height:1.5;text-align:right}
    .viewer{height:min(78vh,860px);background:linear-gradient(#fff,#e9e9e6);border-radius:24px;overflow:hidden;border:1px solid #ddd}
    model-viewer{width:100%;height:100%;--poster-color:transparent}.hint{display:flex;gap:22px;flex-wrap:wrap;padding:16px 2px 0;color:#626262;font-size:13px}
    .pill{background:#fff;border:1px solid #ddd;border-radius:999px;padding:8px 12px}
    @media(max-width:700px){main{padding:14px}.top{display:block}.meta{text-align:left;margin-top:12px}.viewer{height:72vh;border-radius:16px}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <h1>Алюминиевый HS‑портал</h1>
    <div class="meta">4,8 × 2,6 м · низкий порог ~20 мм<br>анимация: ручка → подъём → сдвиг → закрытие</div>
  </div>
  <div class="viewer">
    <model-viewer
      src="models/aluminium_HS_portal_animated.glb"
      alt="Алюминиевый подъёмно-раздвижной HS-портал"
      camera-controls
      auto-rotate
      autoplay
      animation-name="HS_open_close"
      shadow-intensity="1"
      environment-image="neutral"
      exposure="1.05"
      interaction-prompt="auto"
      camera-orbit="35deg 78deg auto"
      min-camera-orbit="auto 55deg auto"
      max-camera-orbit="auto 95deg auto">
    </model-viewer>
  </div>
  <div class="hint">
    <span class="pill">Перетаскивайте — вращение</span>
    <span class="pill">Колесо — масштаб</span>
    <span class="pill">Анимация запускается автоматически</span>
  </div>
</main>
</body>
</html>
